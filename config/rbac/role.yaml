---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - clusters
  - clusters/status
  - machines
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - vultrbaremetalmachines
  - vultrclusters
  - vultrfirewallgroups
  - vultrmachines
  - vultrreservedips
  - vultrstartupscripts
  - vultrvpcs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - vultrbaremetalmachines/finalizers
  - vultrmachines/finalizers
  verbs:
  - update
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - vultrbaremetalmachines/status
  - vultrclusters/status
  - vultrfirewallgroups/status
  - vultrmachines/status
  - vultrreservedips/status
  - vultrstartupscripts/status
  - vultrvpcs/status
  verbs:
  - get
  - patch
  - update
